AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CodePipeline with two CloudFormation deploy actions. RunOrder deploys
  us-east-1 first and eu-west-1 second.

Parameters:
  ProjectName:
    Type: String
    Default: harbor
  Environment:
    Type: String
    Default: dev
  TemplateBaseUrl:
    Type: String
  ArtifactBucketEast:
    Type: String
    Description: Existing us-east-1 bucket for source.zip, router.zip, and pipeline artifacts.
  ArtifactBucketWest:
    Type: String
    Description: Existing eu-west-1 bucket for pipeline artifacts and the router zip in that region.
  AllowedSourceCidr:
    Type: String
    Default: 203.0.113.0/24
  VpcEndpointIdSqs:
    Type: String
  VpcEndpointIdS3:
    Type: String

Resources:
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-cfn-deploy"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: deploy-harbor
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: NestedStacks
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplate
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/${ProjectName}-*/*"
              - Sid: CreateSampleResources
                Effect: Allow
                Action:
                  - apigateway:*
                  - lambda:*
                  - sqs:*
                  - sns:*
                  - s3:*
                  - appconfig:*
                  - cognito-idp:*
                  - rolesanywhere:*
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                Resource: "*"
              - Sid: ManageSampleRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:PassRole
                  - iam:TagRole
                  - iam:UntagRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-*"

  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-pipeline"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: run-pipeline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadArtifacts
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:GetBucketVersioning
                  - s3:PutObject
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${ArtifactBucketEast}"
                  - !Sub "arn:${AWS::Partition}:s3:::${ArtifactBucketEast}/*"
                  - !Sub "arn:${AWS::Partition}:s3:::${ArtifactBucketWest}"
                  - !Sub "arn:${AWS::Partition}:s3:::${ArtifactBucketWest}/*"
              - Sid: DeployStacks
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplate
                  - cloudformation:CreateChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DeleteChangeSet
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/${ProjectName}-*/*"
              - Sid: PassDeployRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt DeployRole.Arn

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub "${ProjectName}-${Environment}"
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStores:
        - Region: us-east-1
          ArtifactStore:
            Type: S3
            Location: !Ref ArtifactBucketEast
        - Region: eu-west-1
          ArtifactStore:
            Type: S3
            Location: !Ref ArtifactBucketWest
      Stages:
        - Name: Source
          Actions:
            - Name: SourceZip
              RunOrder: 1
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: S3
                Version: "1"
              Configuration:
                S3Bucket: !Ref ArtifactBucketEast
                S3ObjectKey: source.zip
                PollForSourceChanges: false
              OutputArtifacts:
                - Name: SourceOutput
        - Name: Deploy
          Actions:
            - Name: DeployUsEast1
              RunOrder: 1
              Region: us-east-1
              InputArtifacts:
                - Name: SourceOutput
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: "1"
              Configuration:
                ActionMode: CREATE_UPDATE
                StackName: !Sub "${ProjectName}-${Environment}-use1"
                TemplatePath: SourceOutput::templates/main.yaml
                Capabilities: CAPABILITY_NAMED_IAM
                RoleArn: !GetAtt DeployRole.Arn
                ParameterOverrides: !Sub
                  - |
                    {
                      "ProjectName": "${ProjectName}",
                      "Environment": "${Environment}",
                      "TemplateBaseUrl": "${TemplateBaseUrl}",
                      "AllowedSourceCidr": "${AllowedSourceCidr}",
                      "VpcEndpointIdSqs": "${VpcEndpointIdSqs}",
                      "VpcEndpointIdS3": "${VpcEndpointIdS3}",
                      "ArtifactBucket": "${ArtifactBucketEast}",
                      "ArtifactKey": "router.zip",
                      "CreateExternalAccess": "false"
                    }
                  - ProjectName: !Ref ProjectName
                    Environment: !Ref Environment
                    TemplateBaseUrl: !Ref TemplateBaseUrl
                    AllowedSourceCidr: !Ref AllowedSourceCidr
                    VpcEndpointIdSqs: !Ref VpcEndpointIdSqs
                    VpcEndpointIdS3: !Ref VpcEndpointIdS3
                    ArtifactBucketEast: !Ref ArtifactBucketEast
            - Name: DeployEuWest1
              RunOrder: 2
              Region: eu-west-1
              InputArtifacts:
                - Name: SourceOutput
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: "1"
              Configuration:
                ActionMode: CREATE_UPDATE
                StackName: !Sub "${ProjectName}-${Environment}-euw1"
                TemplatePath: SourceOutput::templates/main.yaml
                Capabilities: CAPABILITY_NAMED_IAM
                RoleArn: !GetAtt DeployRole.Arn
                ParameterOverrides: !Sub
                  - |
                    {
                      "ProjectName": "${ProjectName}",
                      "Environment": "${Environment}",
                      "TemplateBaseUrl": "${TemplateBaseUrl}",
                      "AllowedSourceCidr": "${AllowedSourceCidr}",
                      "VpcEndpointIdSqs": "${VpcEndpointIdSqs}",
                      "VpcEndpointIdS3": "${VpcEndpointIdS3}",
                      "ArtifactBucket": "${ArtifactBucketWest}",
                      "ArtifactKey": "router.zip",
                      "CreateExternalAccess": "false"
                    }
                  - ProjectName: !Ref ProjectName
                    Environment: !Ref Environment
                    TemplateBaseUrl: !Ref TemplateBaseUrl
                    AllowedSourceCidr: !Ref AllowedSourceCidr
                    VpcEndpointIdSqs: !Ref VpcEndpointIdSqs
                    VpcEndpointIdS3: !Ref VpcEndpointIdS3
                    ArtifactBucketWest: !Ref ArtifactBucketWest

Outputs:
  PipelineName:
    Value: !Ref Pipeline
